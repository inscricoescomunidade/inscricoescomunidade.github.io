<style>
/* VOICE  acolhedor e organizado: a casa da comunidade, não um sistema de banco
   IDEA   o ingresso e a estrela da logo: tudo leva à inscrição confirmada
   PICTURE capas com a estrela de seis pontas em camadas de azul, ingresso com QR Code
   COLOUR azul da logo (#89B4D4 a #6191B5), azul de ação #3D6C94, branco quente #F6F2EC
   TYPE   Outfit nos títulos, Figtree no texto
   LAYOUT início com três portas de entrada; telas com menu lateral no computador e barra inferior no celular */
:root[data-theme=light]{color-scheme:light}
:root{color-scheme:light;--b1:#89B4D4;--b2:#6F9DC1;--b3:#6191B5;--deep:#24486A;--bg:#F6F2EC;--sf:#FFFFFF;--sf2:#EDF3F8;--ink:#1A2F45;--mut:#566A7F;--line:#DCE4EB;--act:#3D6C94;--onact:#FFFFFF;--ok:#11704A;--okb:#E3F4EB;--warn:#8A5300;--warnb:#FFF0D9;--bad:#AE2E26;--badb:#FCE7E5;--f2:#6B4FB0;--f2b:#EFEAFB;--ld1:rgba(246,242,236,.92);--ld2:#E6F0F8;--ld3:#C9DCEC}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0E1925;--sf:#152434;--sf2:#1C2F44;--ink:#E9F0F6;--mut:#A9BACB;--line:#26405A;--act:#8DB8DA;--onact:#0E1925;--ok:#5FD3A0;--okb:#123527;--warn:#FFC36B;--warnb:#3A2A10;--bad:#FF8B82;--badb:#3D1916;--f2:#C3B2FF;--f2b:#2B2448;--ld1:rgba(14,25,37,.92);--ld2:#173048;--ld3:#26496B}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0E1925;--sf:#152434;--sf2:#1C2F44;--ink:#E9F0F6;--mut:#A9BACB;--line:#26405A;--act:#8DB8DA;--onact:#0E1925;--ok:#5FD3A0;--okb:#123527;--warn:#FFC36B;--warnb:#3A2A10;--bad:#FF8B82;--badb:#3D1916;--f2:#C3B2FF;--f2b:#2B2448;--ld1:rgba(14,25,37,.92);--ld2:#173048;--ld3:#26496B}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:Outfit,Figtree,sans-serif;line-height:1.08;letter-spacing:-.015em;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,4.2vw,46px);font-weight:700}
h2{font-size:23px;font-weight:600}
h3{font-size:18px;font-weight:600}
p{margin:0}
a{color:var(--act)}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
.top{position:sticky;top:0;z-index:30;background:var(--ld1);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px max(3vw,16px)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand img{width:42px;height:42px}
.brand b{font-family:Outfit,sans-serif;font-size:20px;font-weight:700;display:block;line-height:1.1}
.brand span{font-size:13px;color:var(--mut);display:block;line-height:1.2}
.views{display:flex;gap:4px;background:var(--sf2);border-radius:14px;padding:4px}
.views a{padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none;color:var(--mut);min-height:40px;display:flex;align-items:center}
.views a[aria-current=true]{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(20,40,60,.12)}
.apv{display:inline-flex;align-items:center;gap:8px;background:var(--deep);color:#fff;border-radius:12px;padding:9px 14px;text-decoration:none;font-weight:700;font-size:14px;min-height:42px;white-space:nowrap}
.apv i{font-style:normal;background:var(--b1);color:#0E1925;border-radius:999px;padding:1px 8px;font-size:12px}
.proto{max-width:1320px;margin:0 auto;padding:6px max(3vw,16px);font-size:13px;color:var(--mut)}
.wrap{max-width:1240px;margin:0 auto;padding:20px max(3vw,16px) 96px}
.app{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:0}
.side{padding:20px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:64px;align-self:start;max-height:calc(100vh - 64px);overflow:auto}
.side .who{display:flex;gap:10px;align-items:center;padding:8px 10px 16px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.side .who img{width:36px;height:36px}
.side .who b{display:block;font-size:14px;line-height:1.25}
.side .who span{font-size:12.5px;color:var(--mut)}
.side a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px}
.side a:hover{background:var(--sf2)}
.side a[aria-current=page]{background:var(--act);color:var(--onact)}
.side .sep{font-size:12.5px;color:var(--mut);padding:12px 12px 4px}
.ico{width:20px;height:20px;flex:none}
.main{padding:22px max(3vw,16px) 96px}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--ld2);border:1px solid var(--ld3);border-radius:16px;padding:12px 14px;margin-bottom:20px;font-size:15px}
.tip b{display:block}
.tip .n{flex:none;width:30px;height:30px;border-radius:9px;background:var(--b3);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.tip a{white-space:nowrap;font-weight:700}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px;margin-bottom:20px}
.head p{color:var(--mut);margin-top:6px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.kpi span{font-size:13.5px;color:var(--mut);display:block}
.kpi b{font-family:Outfit,sans-serif;font-size:clamp(20px,4.6vw,28px);font-weight:600;white-space:nowrap;display:block;margin:2px 0}
.kpi small{font-size:13px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:13px;padding:11px 18px;min-height:46px;font-weight:700;cursor:pointer;text-decoration:none;background:var(--act);color:var(--onact);font-size:15px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--sf);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.wa{background:#1E8E4E;color:#fff}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:11px}
.btn.full{width:100%}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--b2);outline-offset:2px}
label{font-size:14px;font-weight:600;display:block;margin-bottom:6px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--sf);border-radius:12px;padding:10px 12px;font-size:16px;min-height:46px}
textarea{min-height:88px}
.field{margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row>.field{flex:1 1 170px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:15px;margin:8px 0}
.chk input{width:20px;height:20px;min-height:0;margin-top:2px;flex:none;accent-color:var(--act)}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.t-ok{background:var(--okb);color:var(--ok)}
.t-warn{background:var(--warnb);color:var(--warn)}
.t-bad{background:var(--badb);color:var(--bad)}
.t-info{background:var(--sf2);color:var(--act)}
.t-f2{background:var(--f2b);color:var(--f2)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{color:var(--mut)}
.small{font-size:13.5px}
.hero{background:linear-gradient(135deg,#8DB6D6 0%,#6F9DC1 55%,#5584AA 100%);color:#fff;position:relative;overflow:hidden}
.hero .mk{position:absolute;right:-40px;top:-30px;width:min(46vw,430px);opacity:.22;pointer-events:none}
.hero .in{max-width:1240px;margin:0 auto;padding:clamp(34px,6vw,70px) max(3vw,16px) clamp(90px,10vw,120px);position:relative}
.hero h1{color:#fff;max-width:16ch;font-size:clamp(34px,5.4vw,58px)}
.hero p{color:#F2F7FB;max-width:52ch;margin-top:14px;font-size:18px}
.hero .lg{width:78px;height:78px;margin-bottom:18px;filter:drop-shadow(0 6px 14px rgba(20,50,80,.25))}
.doors{max-width:1240px;margin:-72px auto 0;padding:0 max(3vw,16px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;position:relative}
.door{background:var(--sf);border:1px solid var(--line);border-radius:22px;padding:22px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(30,60,90,.10)}
.door:hover{border-color:var(--b2)}
.door .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--sf2);color:var(--act)}
.door .ic svg{width:28px;height:28px}
.door ul{margin:0;padding-left:18px;color:var(--mut);font-size:15px}
.door .go{margin-top:auto;font-weight:700;color:var(--act)}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px}
.how div{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:16px}
.how b{font-family:Outfit,sans-serif;font-size:30px;color:var(--b3);display:block;line-height:1}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.ev{background:var(--sf);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:var(--ink)}
.ev:hover{border-color:var(--b2)}
.ev .cv{aspect-ratio:16/8;display:block;width:100%}
.ev .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:5px;flex:1}
.ev .ft{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 8px;margin-top:auto;padding-top:8px}
.ev .price{font-size:17px}
.price{font-family:Outfit,sans-serif;font-weight:600;font-size:19px;white-space:nowrap}
.cover{border-radius:24px;overflow:hidden;aspect-ratio:16/6}
.cover svg{width:100%;height:100%;display:block}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.sticky{position:sticky;top:84px}
.prog{list-style:none;padding:0;margin:0}
.prog li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.prog li:last-child{border-bottom:0}
.prog b{font-variant-numeric:tabular-nums}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;background:var(--sf)}
.opt:has(input:checked){border-color:var(--act);box-shadow:0 0 0 1px var(--act)}
.opt.sel{border-color:var(--act);box-shadow:0 0 0 1px var(--act)}
.opt input{width:20px;height:20px;min-height:0;margin-top:2px;flex:none;accent-color:var(--act)}
.sum{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.sum.t{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-family:Outfit,sans-serif;font-weight:600;font-size:21px}
.ticket{display:grid;grid-template-columns:minmax(0,1fr) 170px;background:var(--sf);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:12px;position:relative}
.ticket .l{padding:18px 20px;border-right:2px dashed var(--line);display:grid;gap:4px;align-content:start}
.ticket .r{padding:14px;display:grid;place-items:center;background:linear-gradient(160deg,#8DB6D6,#6191B5)}
.ticket .r svg{width:130px;height:130px;background:#fff;border-radius:10px;padding:6px}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bars i{display:block;width:100%;background:var(--b2);border-radius:7px 7px 2px 2px;min-height:3px}
.bars span{font-size:12px;color:var(--mut);white-space:nowrap}
.hb{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.hb i{display:block;height:12px;border-radius:6px;background:var(--b2)}
.mix{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;background:var(--okb);color:var(--ok)}
.alert{border-radius:14px;padding:12px 14px;font-size:15px;margin:10px 0}
.a-ok{background:var(--okb);color:var(--ok)}
.a-bad{background:var(--badb);color:var(--bad)}
.a-warn{background:var(--warnb);color:var(--warn)}
.a-info{background:var(--sf2)}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,22,36,.55);display:grid;place-items:center;padding:16px;z-index:60}
.modal[hidden]{display:none}
.sheet{background:var(--sf);border-radius:22px;max-width:540px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.sheet .x{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;z-index:70;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.scan{border:2px dashed var(--line);border-radius:22px;padding:24px;text-align:center;display:grid;gap:10px;place-items:center;background:var(--sf)}
.scan.okk{border-color:var(--ok);background:var(--okb)}
.lot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lot:last-child{border-bottom:0}
.cert{aspect-ratio:1.414;background:#FFFDF9;color:#1A2F45;border-radius:14px;border:10px solid #DCE8F2;padding:6%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;position:relative;overflow:hidden}
.cert img{width:58px;height:58px}
.cert .nm{font-family:Outfit,sans-serif;font-size:clamp(20px,3.4vw,30px);font-weight:600}
.cert p{font-size:clamp(12px,1.6vw,15px);max-width:44ch}
.player{aspect-ratio:16/9;border-radius:20px;background:radial-gradient(circle at 30% 30%,#3B5F86,#14263A);display:grid;place-items:center;color:#fff;text-align:center;padding:20px}
.player .pl{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;margin:0 auto 12px}
.mod{border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--sf);margin-bottom:10px}
.mod .rw{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{margin:0;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:11px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px}
.seg input{width:16px;height:16px;min-height:0;accent-color:var(--act)}
.seg label:has(input[value=ok]:checked){background:var(--okb);color:var(--ok);border-color:transparent}
.seg label:has(input[value=aj]:checked){background:var(--warnb);color:var(--warn);border-color:transparent}
.seg label.sel-ok{background:var(--okb);color:var(--ok);border-color:transparent}
.seg label.sel-aj{background:var(--warnb);color:var(--warn);border-color:transparent}
.prog-bar{height:10px;border-radius:5px;background:var(--sf2);overflow:hidden;margin:10px 0}
.prog-bar i{display:block;height:100%;background:var(--b3)}
.tabs{display:none}
.perm td:not(:first-child),.perm th:not(:first-child){text-align:center}
@media(max-width:980px){.app{grid-template-columns:minmax(0,1fr)}.side{display:none}.doors{grid-template-columns:minmax(0,1fr)}.how{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)}.sticky{position:static}.views{display:none}
.tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sf);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs a,.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;font-weight:600;text-decoration:none;color:var(--mut);background:none;border:0;border-radius:12px;min-height:52px;cursor:pointer}
.tabs [aria-current=page]{color:var(--act);background:var(--sf2)}
.tabs svg{width:22px;height:22px}}
@media(max-width:600px){.g2{grid-template-columns:minmax(0,1fr)}.ticket{grid-template-columns:minmax(0,1fr)}.ticket .l{border-right:0;border-bottom:2px dashed var(--line)}.cover{aspect-ratio:16/9}.brand>span>span{display:none}.brand b{font-size:17px}.apv span{display:none}.hb{grid-template-columns:minmax(0,1fr) auto}.hb i{grid-column:1/-1;grid-row:2}table{font-size:14px}th,td{padding:8px 6px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0;text-align:right}.stack td::before{content:attr(data-l);color:var(--mut);font-size:13px;text-align:left}.how{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:no-preference){.ev,.door,.btn{transition:border-color .15s,filter .15s,transform .15s}.door:hover{transform:translateY(-2px)}}
</style>
</head>

 ${e.status==='Publicado'?`<a class="btn full" href="#inscricao-${e.id}">Inscrever-se</a>`:'<span class="tag t-info">Evento realizado</span>'}<p class="small mut" style="margin-top:10px">O pagamento vai direto para a conta da ${esc(c.nome)}, CNPJ ${esc(c.cnpj)}.</p></aside></div></div>`}

 if(ck.cupom)lin+=`<div class="sum"><span>Cupom ${esc(ck.cupom.cod)} (${ck.cupom.pct}%)</span><b>− ${brl(sub-base)}</b></div>`;
 if(ck.met==='cartao'){tot=cardTotal(base,ck.parc,e);if(ck.parc>1)lin+=`<div class="sum"><span>Acréscimo do parcelamento</span><b>${brl(tot-base)}</b></div><div class="sum small mut"><span>${ck.parc} parcelas de</span><span>${brl(tot/ck.parc)}</span></div>`}
 if(ck.met==='carne')lin+=`<div class="sum small mut"><span>${ck.parc} boletos de</span><span>${brl(base/ck.parc)}</span></div>`;

 if(act==='scan'){const l=regs.filter(x=>x.ev===ckEv&&x.status==='confirmada'&&!x.checkin);if(!l.length){toast('Todos os inscritos já entraram.');return}const x=l[Math.floor(rnd()*l.length)];x.checkin=true;lastScan=x;route()}
 if(act==='credencial'){modal(`${mHead('Credencial')}<div class="ticket" style="grid-template-columns:minmax(0,1fr) 140px"><div class="l"><img src="${LOGO}" alt="" style="width:40px;height:40px"><h2>${esc(r.nome)}</h2><span class="small">${esc(evBy(r.ev).nome)}</span><span class="small mut">${esc(r.origem)}</span></div><div class="r">${qr(r.cod)}</div></div><p class="small mut">No sistema real, imprime na impressora de etiquetas da recepção.</p>`)}
 if(act==='emitir'){toast(`Simulação: ${a.dataset.n} certificados emitidos e enviados por e-mail.`)}
 if(act==='convidar'){modal(`${mHead('Convidar pessoa')}<div class="field"><label for="cvn">Nome</label><input id="cvn" value="Thaís Barbosa"></div><div class="field"><label for="cve">E-mail</label><input id="cve" value="thais@exemplo.com"></div><div class="field"><label for="cvp">Perfil</label><select id="cvp"><option>Secretaria</option><option>Tesouraria</option><option>Check-in</option><option>Pastor (responsável)</option></select></div><p class="small mut">A pessoa recebe um convite e precisa ativar a verificação em duas etapas no primeiro acesso.</p>${mBtns('Enviar convite','okconvite')}`)}
 if(act==='okconvite'){equipe.push({n:$('#cvn').value||'Nova pessoa',e:$('#cve').value,p:$('#cvp').value,f:false});audit.unshift({d:'agora',q:'Ana Costa',p:'Tesouraria',o:'Convidou '+($('#cvn').value||'nova pessoa')});close();toast('Convite enviado.');route()}
 if(act==='exportar')toast('No sistema real, baixa a planilha. No protótipo, só simula.');
 if(act==='baixar')toast('No sistema real, baixa o arquivo. No protótipo, só simula.');
 if(act==='salvar')toast('Dados atualizados.');
 if(act==='excluir'){modal(`${mHead('Excluir minha conta')}<p>Seus dados pessoais serão apagados. Inscrições pagas ficam registradas pelo prazo exigido por lei, sem uso para outra finalidade.</p>${mBtns('Excluir conta','okexcluir','','danger')}`)}
 if(act==='okexcluir'){close();toast('Simulação: pedido de exclusão registrado.')}
 if(act==='politica'){modal(`${mHead('Política de privacidade')}<ul style="padding-left:18px;margin:0;display:grid;gap:8px"><li>Seus dados ficam em servidores no Brasil.</li><li>A igreja do evento é a responsável pelos dados da sua inscrição. A plataforma só opera o sistema.</li><li>Dados do cartão vão direto ao Asaas e não ficam guardados aqui.</li><li>Você pode baixar ou excluir seus dados quando quiser.</li><li>Registros de acesso ficam guardados por 6 meses, como exige o Marco Civil da Internet.</li></ul><p class="small mut" style="margin-top:10px">Texto de exemplo para o protótipo.</p>`)}
 if(act==='sacar'){const s=saldo();modal(`${mHead('Sacar')}<p class="mut">Disponível: <b>${brl(s)}</b></p><div class="field" style="margin-top:12px"><label for="sv">Valor (R$)</label><input id="sv" type="number" min="1" max="${s}" step="0.01" value="${Math.floor(s/100)*100}"></div><div class="field"><label for="sd">Conta de destino</label><select id="sd"><option>Banco do Brasil · ag. 1234 · cc 56789-0 · ${esc(me.nome)}</option></select></div><details style="margin-bottom:12px"><summary class="small" style="cursor:pointer;min-height:32px">Cadastrar outra conta bancária</summary><div class="field" style="margin-top:10px"><label for="nc">CNPJ do titular da conta</label><input id="nc" value="47.120.553/0001-08"></div><button class="btn ghost sm" data-act="novaconta">Validar conta</button><div id="ncr"></div></details>${mBtns('Confirmar saque','oksaque')}`)}
 if(act==='novaconta'){const v=$('#nc').value.trim();$('#ncr').innerHTML=v===me.cnpj?'<div class="alert a-ok">Conta aceita: mesmo CNPJ da igreja.</div>':'<div class="alert a-bad">Recusada: só é permitido sacar para conta bancária no mesmo CNPJ da igreja que recebeu as inscrições.</div>'}
 if(act==='oksaque'){const v=r2(+$('#sv').value);const s=saldo();if(!(v>0)||v>s){toast('Valor acima do disponível.');return}saques.push({valor:v,data:new Date(TODAY)});audit.unshift({d:'agora',q:'Ana Costa',p:'Tesouraria',o:`Sacou ${brl(v)} para a conta da igreja`});close();toast(`Saque de ${brl(v)} solicitado. Cai em até 1 dia útil.`);route()}
 if(act==='antecipar'){const l=myRegs().filter(x=>x.status==='confirmada'&&x.metodo==='cartao');let v=0,c=0;l.forEach(x=>{for(let j=1;j<=x.parc;j++){const t=+x.data+32*j*DAY;if(t>+TODAY){const p=x.liq/x.parc;v+=p;c+=p*.0125*((t-TODAY)/(30*DAY))}}});
  modal(`${mHead('Simular antecipação')}<p>Parcelas de cartão ainda a entrar: <b>${brl(v)}</b></p><div class="sum"><span>Custo estimado (1,25% ao mês)</span><b>− ${brl(c)}</b></div><div class="sum t"><span>Você recebe em até 2 dias úteis</span><span>${brl(v-c)}</span></div><p class="small mut" style="margin-top:8px">Sujeito à análise de crédito do Asaas.</p>${mBtns('Solicitar antecipação','okant')}`)}
 if(act==='okant'){close();toast('Simulação: pedido de antecipação enviado ao Asaas.')}
 if(act==='copiar'){const t=apText();const done=()=>toast('Avaliação copiada. Cole no WhatsApp ou no e-mail.');try{navigator.clipboard.writeText(t).then(done,()=>fallback(t))}catch(err){fallback(t)}}
});
function fallback(t){modal(`${mHead('Copiar avaliação')}<p class="small mut">Selecione o texto e copie.</p><textarea style="min-height:260px" readonly>${esc(t)}</textarea>`)}
saveAp();addEventListener('hashchange',route);route();
}
</script>
</body>
</html>
